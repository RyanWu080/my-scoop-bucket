name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
      - name: Verify HWiNFO Beta update result
        shell: pwsh
        run: |
          $manifest = Get-Content ./bucket/hwinfo-beta.json -Raw | ConvertFrom-Json
          $response = Invoke-WebRequest -Uri $manifest.checkver.url -TimeoutSec 30 -ErrorAction Stop
          $match = [regex]::Match($response.Content, $manifest.checkver.regex)
          if (!$match.Success) {
              throw 'The official HWiNFO update feed did not contain a valid Beta version.'
          }
          $version = '{0}.{1}-{2}' -f $match.Groups['major'].Value, $match.Groups['minor'].Value, $match.Groups['build'].Value
          Write-Host "hwinfo-beta: official Beta $version; manifest $($manifest.version)"
          if ($version -ne $manifest.version) {
              throw "HWiNFO Beta was not updated to $version. Check the Excavator download and hash logs."
          }
      - name: Verify HWiNFO Beta download hashes
        shell: pwsh
        run: |
          $manifest = Get-Content ./bucket/hwinfo-beta.json -Raw | ConvertFrom-Json
          foreach ($arch in @('64bit', 'arm64')) {
              $package = $manifest.architecture.$arch
              $archive = Join-Path $env:RUNNER_TEMP "hwinfo-beta-$arch.7z"
              try {
                  Invoke-WebRequest -Uri $package.url -OutFile $archive -TimeoutSec 120 -ErrorAction Stop
                  $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
                  if ($actualHash -ne $package.hash) {
                      throw "HWiNFO Beta $arch download hash mismatch."
                  }
                  Write-Host "hwinfo-beta: $arch download and SHA-256 verified"
              } finally {
                  Remove-Item $archive -Force -ErrorAction SilentlyContinue
              }
          }
